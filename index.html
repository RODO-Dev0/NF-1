<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0906">
<title>کوردپایرەت · KurdPirate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Vazirmatn:wght@400;500;600;700;800&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
<style>
:root{
  --bg:#0B0906;
  --bg-2:#120D08;
  --panel:#1B140C;
  --panel-2:#241A0F;
  --hair:#3A2C17;
  --hair-2:#2A2013;
  --parchment:#EFE2C3;
  --ink:#F4ECD8;
  --muted:#A6926C;
  --muted-dim:#7A6B4E;
  --gold:#D4A72C;
  --gold-bright:#F0C860;
  --gold-deep:#8A6A16;
  --blood:#8A2A24;
  --blood-bright:#C4453B;
  --emerald:#3E7D5A;
  --r:16px;
  --r-lg:22px;
  --r-pill:999px;
  --display:"Pirata One",serif;
  --serif:"Cinzel",serif;
  --sans:"Vazirmatn",system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow-x:hidden}
body{
  min-height:100vh;
  background:
    radial-gradient(120% 60% at 50% -10%, rgba(212,167,44,.10), transparent 60%),
    radial-gradient(90% 50% at 100% 110%, rgba(138,42,36,.10), transparent 60%),
    var(--bg);
}
/* subtle grain */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.05;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
input,textarea{font-family:inherit;color:inherit}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
::selection{background:var(--gold);color:#20160a}

#app{position:relative;z-index:2;max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:92px}

/* ===== Top bar ===== */
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 14px) 16px 12px;
  background:linear-gradient(180deg, rgba(11,9,6,.96), rgba(11,9,6,.82) 70%, transparent);
  backdrop-filter:blur(10px);
}
.icon-btn{width:42px;height:42px;border-radius:var(--r-pill);display:grid;place-items:center;background:var(--panel);border:1px solid var(--hair);color:var(--parchment);font-size:1.15rem;transition:transform .3s var(--spring),background .3s}
.icon-btn svg{width:20px;height:20px}
.icon-btn:active{transform:scale(.88)}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:34px;height:34px;border-radius:9px;box-shadow:0 4px 14px -6px rgba(212,167,44,.5)}
.brand .word{font-family:var(--display);font-size:1.5rem;letter-spacing:.5px;color:var(--gold-bright);
  text-shadow:0 2px 0 #00000080;}

/* ===== Drawer ===== */
.scrim{position:fixed;inset:0;background:rgba(6,4,2,.6);backdrop-filter:blur(2px);z-index:40;opacity:0;pointer-events:none;transition:opacity .35s var(--ease)}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;bottom:0;right:0;width:min(78vw,340px);z-index:41;background:var(--bg-2);
  border-left:1px solid var(--hair);transform:translateX(100%);transition:transform .4s var(--ease);
  padding:calc(env(safe-area-inset-top) + 20px) 22px 20px;overflow-y:auto;
}
.drawer.open{transform:translateX(0)}
.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.drawer-title{font-family:var(--display);font-size:1.4rem;color:var(--gold-bright)}
.drawer-link{display:flex;align-items:center;justify-content:space-between;padding:15px 4px;border-bottom:1px solid var(--hair-2);font-size:1.02rem;color:var(--parchment);font-weight:600}
.drawer-link .chev{color:var(--muted-dim);font-size:.85rem}

/* ===== Views ===== */
.view{display:none;padding:0 16px 8px}
.view.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ===== Section headers ===== */
.sec-title{font-family:var(--display);font-size:1.5rem;color:var(--gold-bright);margin:22px 2px 14px;display:flex;align-items:center;gap:10px}
.sec-title .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--hair),transparent)}

/* ===== Hero ===== */
.hero{position:relative;border-radius:var(--r-lg);overflow:hidden;height:220px;margin-top:6px;box-shadow:0 20px 40px -22px rgba(0,0,0,.7);border:1px solid var(--hair)}
.hero-track{display:flex;width:100%;height:100%;direction:ltr;transition:transform .6s cubic-bezier(.65,0,.35,1)}
.hero-slide-item{flex:0 0 100%;width:100%;height:100%;position:relative}
.hero-slide-item img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, transparent 30%, rgba(9,7,4,.94) 96%);pointer-events:none}
.hero-body{position:absolute;left:0;right:0;bottom:0;padding:16px;z-index:2}
.hero-body.fade-swap{animation:heroBodyFade .5s ease}
@keyframes heroBodyFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.hero-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(11,9,6,.7);border:1px solid var(--hair);border-radius:var(--r-pill);padding:3px 10px;font-size:.78rem;font-weight:700;color:var(--gold-bright);margin-bottom:8px}
.hero-title{font-family:var(--display);font-size:1.7rem;color:var(--parchment);line-height:1.15;margin-bottom:6px;text-shadow:0 2px 6px #000}
.hero-meta{font-size:.82rem;color:var(--muted);margin-bottom:12px}
.hero-actions{display:flex;gap:10px}
.hero-dots{position:absolute;top:12px;left:14px;display:flex;gap:5px;z-index:2;direction:ltr}
.hero-dots span{width:6px;height:6px;border-radius:50%;background:rgba(239,226,195,.35)}
.hero-dot-pill{position:absolute;top:0;left:0;width:16px;height:6px;border-radius:4px;background:var(--gold-bright);transition:transform .5s cubic-bezier(.65,0,.35,1)}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important;transition-duration:.001ms !important;} }

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:var(--r-pill);font-weight:700;font-size:.92rem;transition:transform .25s var(--spring),filter .25s}
.btn:active{transform:scale(.95)}
.btn-gold{background:linear-gradient(180deg,var(--gold-bright),var(--gold));color:#221805;box-shadow:0 10px 24px -10px rgba(212,167,44,.55)}
.btn-ghost{background:rgba(239,226,195,.08);color:var(--parchment);border:1px solid var(--hair)}
.btn-blood{background:linear-gradient(180deg,var(--blood-bright),var(--blood));color:#fff0ee}
.btn-block{width:100%}
.btn-sm{padding:9px 16px;font-size:.8rem}

/* ===== Category chips ===== */
.chip-row{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chip-row::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 16px;border-radius:var(--r-pill);background:var(--panel);border:1px solid var(--hair);font-size:.82rem;font-weight:600;color:var(--muted);white-space:nowrap;transition:.25s}
.chip.on{background:var(--gold);color:#221805;border-color:var(--gold)}

/* ===== Movie grid & cards ===== */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid.cw{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:64%;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.grid.cw::-webkit-scrollbar{display:none}
.card{position:relative;border-radius:var(--r);overflow:hidden;background:var(--panel);border:1px solid var(--hair);cursor:pointer;transition:transform .3s var(--spring)}
.card:active{transform:scale(.96)}
.card .poster-wrap{position:relative;aspect-ratio:2/3;overflow:hidden;background:var(--panel-2)}
.card .poster-wrap img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:8px;display:flex;align-items:center;gap:3px;background:rgba(11,9,6,.78);backdrop-filter:blur(4px);border-radius:var(--r-pill);padding:3px 8px;font-size:.72rem;font-weight:800}
.badge.rating{right:8px;color:var(--gold-bright)}
.badge.adult{left:8px;background:var(--blood);color:#fff}
.badge.progress{left:0;right:0;bottom:0;top:auto;border-radius:0;padding:0;height:4px;background:rgba(255,255,255,.15)}
.badge.progress i{display:block;height:100%;background:var(--gold-bright)}
.card .fav{position:absolute;bottom:8px;left:8px;width:30px;height:30px;border-radius:50%;background:rgba(11,9,6,.65);display:grid;place-items:center;font-size:.95rem;color:var(--parchment)}
.card .fav.on{color:var(--blood-bright)}
.card .info{padding:9px 10px 12px}
.card .t{font-size:.86rem;font-weight:700;color:var(--parchment);line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.card .m{font-size:.72rem;color:var(--muted-dim);margin-top:3px}

/* ===== Categories page tiles ===== */
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
.cat-tile{display:flex;align-items:center;justify-content:space-between;padding:20px 16px;border-radius:var(--r);
  background:linear-gradient(160deg, var(--panel-2), var(--panel));border:1px solid var(--hair);font-weight:700;font-size:.98rem}
.cat-tile .ic{width:38px;height:38px;border-radius:11px;background:rgba(212,167,44,.14);color:var(--gold-bright);display:grid;place-items:center;font-size:1.05rem}
.cat-tile .ic svg{width:19px;height:19px}

/* ===== Search ===== */
.search-box{position:relative;margin-top:8px}
.search-box input{width:100%;padding:14px 46px 14px 16px;border-radius:var(--r-pill);background:var(--panel);border:1px solid var(--hair);color:var(--parchment);font-size:.95rem}
.search-box input:focus{outline:none;border-color:var(--gold-deep)}
.search-box .sic{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted)}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .ic{font-size:2.4rem;margin-bottom:10px;opacity:.6}

/* ===== Bottom nav ===== */
.navbar{
  position:fixed;bottom:0;left:0;right:0;z-index:30;max-width:520px;margin:0 auto;
  display:flex;justify-content:space-around;align-items:center;
  padding:10px 6px calc(env(safe-area-inset-bottom) + 8px);
  background:rgba(18,13,8,.92);backdrop-filter:blur(14px);border-top:1px solid var(--hair);
}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted-dim);font-size:.68rem;font-weight:700;padding:4px 10px;border-radius:14px;transition:.3s}
.nav-btn .ic{font-size:1.25rem}
.nav-btn .ic svg{width:22px;height:22px;display:block}
.nav-btn.active{color:var(--gold-bright)}

/* ===== Auth / account view ===== */
.auth-wrap{padding-top:26px;text-align:center}
.auth-wrap .logo{width:96px;height:96px;margin:0 auto 14px;border-radius:22px;box-shadow:0 16px 34px -14px rgba(212,167,44,.5)}
.auth-wrap h1{font-family:var(--display);font-size:1.7rem;color:var(--gold-bright);margin:0 0 4px}
.auth-wrap p.tag{color:var(--muted);font-size:.85rem;margin:0 0 26px;font-family:var(--serif);letter-spacing:.5px}
.field{position:relative;margin-bottom:12px;text-align:right}
.field input{width:100%;padding:14px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--hair);color:var(--parchment);font-size:.95rem}
.field input:focus{outline:none;border-color:var(--gold-deep)}
.auth-switch{margin-top:18px;font-size:.85rem;color:var(--muted)}
.auth-switch b{color:var(--gold-bright);cursor:pointer}
.auth-err{color:var(--blood-bright);font-size:.82rem;margin-top:8px;min-height:1em}

.profile-card{display:flex;align-items:center;gap:14px;padding:18px;border-radius:var(--r-lg);background:var(--panel);border:1px solid var(--hair);margin-top:10px}
.avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(160deg,var(--gold-bright),var(--gold-deep));display:grid;place-items:center;font-family:var(--display);font-size:1.5rem;color:#20160a}
.profile-name{font-weight:800;font-size:1.05rem;color:var(--parchment)}
.profile-sub{font-size:.78rem;color:var(--muted-dim);margin-top:2px}
.list-row{display:flex;align-items:center;justify-content:space-between;padding:15px 4px;border-bottom:1px solid var(--hair-2);font-weight:600;color:var(--parchment)}
.list-row .ic{margin-inline-end:12px;color:var(--gold-bright)}
.footer-credit{text-align:center;color:var(--muted-dim);font-size:.72rem;margin:36px 0 10px;font-family:var(--serif);letter-spacing:.5px}

/* ===== Detail overlay ===== */
.detail{position:fixed;inset:0;z-index:50;background:var(--bg);transform:translateY(100%);transition:transform .4s var(--ease);overflow-y:auto}
.detail.open{transform:translateY(0)}
.detail-hero{position:relative;height:320px}
.detail-hero img{width:100%;height:100%;object-fit:cover}
.detail-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(11,9,6,.2), var(--bg) 92%)}
.detail-close{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:16px;z-index:2;width:40px;height:40px;border-radius:50%;background:rgba(11,9,6,.6);backdrop-filter:blur(6px);display:grid;place-items:center;color:var(--parchment)}
.detail-body{padding:0 18px 40px;margin-top:-46px;position:relative;z-index:2}
.detail-title{font-family:var(--display);font-size:1.9rem;color:var(--parchment);text-shadow:0 2px 8px #000}
.detail-meta{display:flex;align-items:center;gap:10px;margin:8px 0 16px;font-size:.85rem;color:var(--muted)}
.detail-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.tag-pill{font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:var(--r-pill);background:var(--panel);border:1px solid var(--hair);color:var(--muted)}
.tag-pill.gold{color:var(--gold-bright);border-color:var(--gold-deep)}

/* ===== Ad slot ===== */
.ad-slot{border:1px dashed var(--hair);border-radius:14px;padding:18px;text-align:center;margin:14px 0;color:var(--muted-dim);font-size:.78rem}
.ad-slot .ad-size{color:var(--muted);font-size:.8rem;margin-bottom:4px}
.ad-slot a{color:var(--gold-bright);text-decoration:underline;text-underline-offset:3px}

/* ===== Share row ===== */
.share-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.share-row .lbl{font-size:.78rem;color:var(--muted-dim);margin-inline-end:4px}
.share-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:1px solid var(--hair);color:var(--parchment);transition:transform .25s var(--spring),border-color .25s}
.share-btn:hover{transform:translateY(-3px);border-color:var(--gold-deep)}
.share-btn svg{width:17px;height:17px}
.copy-link-btn{margin-inline-start:auto;display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--r-pill);background:var(--panel);border:1px solid var(--hair);color:var(--muted);font-size:.78rem;font-weight:700}
.copy-link-btn:hover{border-color:var(--gold-deep);color:var(--gold-bright)}
.copy-link-btn svg{width:14px;height:14px}

/* ===== Adult warning banner ===== */
.adult-banner{display:flex;align-items:center;gap:10px;background:rgba(196,50,38,.12);border:1px solid rgba(196,50,38,.4);border-radius:12px;padding:10px 14px;font-size:.8rem;color:#e8a49c;margin:12px 0}
.adult-banner svg{width:20px;height:20px;flex-shrink:0;color:var(--blood-bright)}

/* ===== Cast / crew ===== */
.crew-row{display:flex;gap:22px;flex-wrap:wrap;margin:14px 0;font-size:.82rem}
.crew-row .k{color:var(--muted-dim);font-size:.72rem;margin-bottom:2px}
.crew-row .v{color:var(--parchment)}
.cast-chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.cast-chip{padding:5px 12px;border-radius:var(--r-pill);background:var(--panel);border:1px solid var(--hair);font-size:.76rem;color:var(--muted)}

/* ===== Feedback / report ===== */
.feedback-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border-radius:12px;background:rgba(196,50,38,.08);border:1px solid rgba(196,50,38,.3);color:#e8a49c;font-size:.82rem;font-weight:700;margin:10px 0}
.feedback-btn svg{width:16px;height:16px}

/* ===== Season dropdown + numbered episode grid ===== */
.season-select{width:100%;padding:11px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--hair);color:var(--parchment);font-family:inherit;font-size:.86rem;margin-bottom:14px}
.ep-nav-row{display:flex;gap:10px;margin-bottom:14px}
.ep-nav-row button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:12px;background:var(--panel);border:1px solid var(--hair);color:var(--muted);font-size:.8rem;font-weight:700}
.ep-nav-row button:disabled{opacity:.35}
.ep-nav-row button:not(:disabled):hover{border-color:var(--gold-deep);color:var(--gold-bright)}
.ep-num-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:10px}
.ep-num-btn{aspect-ratio:1;border-radius:12px;background:var(--panel);border:1px solid var(--hair);color:var(--muted);font-weight:800;font-size:.92rem;display:grid;place-items:center;transition:.2s}
.ep-num-btn:hover{border-color:var(--gold-deep);color:var(--gold-bright)}
.ep-num-btn.active{background:var(--gold-bright);color:#221805;border-color:var(--gold-bright)}
.ep-num-btn.coming{opacity:.5}
.site-footer{text-align:center;padding:28px 10px 10px;margin-top:10px;border-top:1px solid var(--hair)}
.site-footer-brand{font-family:var(--display);font-size:1.1rem;color:var(--gold-bright);letter-spacing:.04em}
.site-footer-line{font-size:.78rem;color:var(--muted);margin-top:6px}
.watermark-card{max-width:280px;margin:14px auto 0;padding:14px 20px;border-radius:16px;background:var(--panel);border:1px dashed var(--hair);transition:border-color .3s ease}
.watermark-card:hover{border-color:var(--gold-deep)}
.watermark-card a{display:flex;align-items:center;justify-content:center;gap:9px;color:var(--muted);font-size:.84rem;font-weight:600;text-decoration:none;direction:ltr}
.watermark-card a svg{width:17px;height:17px;flex-shrink:0;animation:iconPulse 2.6s ease-in-out infinite}
.watermark-card a span{font-family:var(--display);color:var(--gold-bright);font-size:.98rem;transition:color .25s ease}
.watermark-card a:hover span{color:#fff}
.watermark-card a:hover svg{animation-duration:.8s}
@keyframes iconPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.sand-wave{height:22px;overflow:hidden;margin:2px 0 10px;opacity:.4;pointer-events:none}
.sand-wave svg{width:200%;height:100%;display:block;stroke:var(--gold-bright);stroke-width:1.2;animation:sandDrift 20s linear infinite}
@keyframes sandDrift{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.site-footer-links{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:center;margin-top:14px;}
.site-footer-links button{background:none;border:none;color:var(--muted);font-size:.76rem;text-decoration:underline;text-underline-offset:3px;}
.site-footer-links button:hover{color:var(--gold-bright)}
.info-modal{position:fixed;left:50%;bottom:0;transform:translate(-50%,110%);width:100%;max-width:560px;max-height:78vh;background:var(--panel);border:1px solid var(--hair);border-radius:20px 20px 0 0;z-index:220;transition:transform .35s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column;}
.info-modal.open{transform:translate(-50%,0);}
.info-modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--hair);}
.info-modal-head span{font-family:var(--display);font-size:1.2rem;color:var(--gold-bright);}
.info-modal-body{padding:16px 18px 34px;overflow-y:auto;color:var(--muted);font-size:.86rem;line-height:1.8;}
.info-modal-body h4{color:var(--parchment);font-size:.94rem;margin:14px 0 6px;}
.info-modal-body h4:first-child{margin-top:0;}
#info-scrim{z-index:210;}
.detail-meta .r{color:var(--gold-bright);font-weight:800}
.detail-actions{display:flex;gap:10px;margin-bottom:20px}
.detail-actions .fav-lg{width:48px;height:48px;flex:0 0 48px;border-radius:50%;background:var(--panel);border:1px solid var(--hair);display:grid;place-items:center;font-size:1.15rem;color:var(--parchment)}
.detail-actions .fav-lg.on{color:var(--blood-bright);border-color:var(--blood)}
.detail-desc{color:var(--muted);font-size:.92rem;line-height:1.7;margin-bottom:20px}
.player-wrap{border-radius:var(--r);overflow:hidden;background:#000;margin-bottom:22px;border:1px solid var(--hair)}
.player-wrap video{width:100%;display:block;max-height:56vw}
.rate-row{display:flex;align-items:center;gap:6px;margin-bottom:22px;flex-wrap:wrap}
.rate-star{font-size:1.3rem;color:var(--hair);cursor:pointer;transition:.15s}
.rate-star.on{color:var(--gold-bright)}
.comment-box{display:flex;gap:8px;margin-bottom:18px}
.comment-box textarea{flex:1;resize:none;height:44px;padding:12px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--hair);color:var(--parchment);font-size:.88rem}
.comment{padding:12px 0;border-bottom:1px solid var(--hair-2)}
.comment .who{font-weight:700;font-size:.85rem;color:var(--gold-bright)}
.comment .txt{font-size:.86rem;color:var(--parchment);margin-top:3px;line-height:1.5}
.comment .when{font-size:.7rem;color:var(--muted-dim);margin-top:4px}

/* ===== Toast ===== */
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%) translateY(20px);z-index:60;
  background:var(--panel-2);border:1px solid var(--hair);color:var(--parchment);padding:11px 20px;border-radius:var(--r-pill);
  font-size:.85rem;font-weight:600;opacity:0;pointer-events:none;transition:.35s var(--ease);box-shadow:0 14px 30px -14px rgba(0,0,0,.6)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== Coming soon box ===== */
.coming-box{position:relative;border-radius:var(--r);overflow:hidden;background:var(--panel-2);border:1px solid var(--hair);}
.coming-box.sz-ep{height:110px;margin-bottom:10px;}
.coming-box.sz-hero{height:200px;margin-bottom:18px;}
.coming-box .cb-media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.coming-box .cb-overlay{position:absolute;inset:0;background:linear-gradient(180deg, rgba(11,9,6,.35), rgba(11,9,6,.92));}
.coming-box.cb-fade .cb-media{animation:cbFade 4s ease-in-out infinite;}
@keyframes cbFade{0%,100%{opacity:.55}50%{opacity:1}}
.coming-box .cb-content{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--parchment);text-align:center;padding:10px;}
.coming-box .cb-icon{font-size:1.4rem;color:var(--gold-bright);}
.coming-box .cb-label{font-family:var(--display);font-size:1.05rem;color:var(--gold-bright);}
.coming-box .cb-sub{font-size:.76rem;color:var(--muted);}
.card .coming-ribbon{position:absolute;bottom:8px;right:8px;left:8px;background:rgba(11,9,6,.8);border:1px solid var(--gold-deep);color:var(--gold-bright);font-size:.66rem;font-weight:800;padding:4px 8px;border-radius:8px;z-index:2;text-align:center}

/* ===== Episodes / seasons ===== */
.ep-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--hair-2);cursor:pointer}
.ep-row .ep-num{width:34px;height:34px;border-radius:50%;background:var(--panel);border:1px solid var(--hair);display:grid;place-items:center;font-weight:800;color:var(--gold-bright);font-size:.85rem;flex:0 0 34px}
.ep-row .ep-info{flex:1;min-width:0}
.ep-row .ep-title{font-weight:700;font-size:.9rem;color:var(--parchment)}
.ep-row .ep-sub{font-size:.74rem;color:var(--muted-dim);margin-top:2px}
.ep-row.active .ep-num{background:var(--gold);color:#221805;border-color:var(--gold)}

.skel{background:linear-gradient(100deg, var(--panel) 30%, var(--panel-2) 50%, var(--panel) 70%);background-size:200% 100%;animation:shimmer 1.4s infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--hair);border-top-color:var(--gold-bright);animation:spin 1s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

let session = null;
let profile = null;
let allMovies = [];
let watchlistIds = new Set();
let progressMap = {};   // movie_id -> {progress_seconds, duration_seconds}
let heroIdx = 0, heroTimer = null;
let currentListFilter = null;

const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));

function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2200);
}

const CAT_LABELS = {
  "type:series":"زنجیرەکان","type:movie":"فیلمەکان","type:short":"کورتەفیلم","type:anime":"ئەنیمەیی",
  "lang:kurdish":"کوردی","lang:farsi":"فارسی","coming:1":"بەرنامەوانە","top:1":"Top 250"
};
function matchFilter(m, key){
  const [k,v] = key.split(":");
  if(k==="type") return m.type===v;
  if(k==="lang") return m.language===v;
  if(k==="coming") return !!m.is_coming_soon;
  if(k==="top") return !!m.is_top250;
  return true;
}
/* ---------- Coming soon box ---------- */
function comingBoxHtml(item, sizeClass, subLabel){
  const bg = item.bg_media_url;
  const isVideo = item.bg_media_type === "video";
  const fadeClass = item.bg_fade !== false ? "cb-fade" : "";
  const dateVal = item.release_date || item.coming_soon_date;
  const label = dateVal ? ("بەرواری: " + new Date(dateVal+"T00:00:00").toLocaleDateString("ku")) : "بەم زووانە";
  return `<div class="coming-box ${sizeClass} ${fadeClass}" data-speed="${item.bg_speed||1}">
    ${bg ? (isVideo ? `<video class="cb-media" src="${bg}" autoplay muted loop playsinline></video>` : `<img class="cb-media" src="${bg}" alt="">`) : ""}
    <div class="cb-overlay"></div>
    <div class="cb-content">
      <span class="cb-icon">⏳</span>
      <span class="cb-label">${label}</span>
      ${subLabel?`<span class="cb-sub">${subLabel}</span>`:""}
    </div>
  </div>`;
}
function applyComingSpeeds(root){
  (root||document).querySelectorAll(".coming-box video.cb-media").forEach(v=>{
    v.playbackRate = parseFloat(v.closest(".coming-box")?.dataset.speed) || 1;
  });
}
async function fetchEpisodesFor(movieId){
  const { data, error } = await sb.from("episodes").select("*").eq("movie_id", movieId)
    .order("season", {ascending:true}).order("episode_number", {ascending:true});
  return error ? [] : (data||[]);
}

function posterCard(m){
  const pct = progressMap[m.id+":0"] && progressMap[m.id+":0"].duration_seconds
    ? Math.min(100, Math.round(100*progressMap[m.id+":0"].progress_seconds/progressMap[m.id+":0"].duration_seconds)) : 0;
  const fav = watchlistIds.has(m.id) ? "on" : "";
  return `<div class="card" data-id="${m.id}">
    <div class="poster-wrap">
      <img src="${m.poster_url||''}" loading="lazy" alt="">
      ${m.rating?`<span class="badge rating">★ ${m.rating}</span>`:""}
      ${m.is_adult?`<span class="badge adult">+18</span>`:""}
      <button class="fav ${fav}" data-fav="${m.id}">${fav?"♥":"♡"}</button>
      ${pct>0?`<span class="badge progress"><i style="width:${pct}%"></i></span>`:""}
      ${m.is_coming_soon?`<span class="coming-ribbon">${m.coming_soon_date?('بەرواری: '+new Date(m.coming_soon_date).toLocaleDateString('ku')):'بەم زووانە'}</span>`:""}
    </div>
    <div class="info"><div class="t">${m.title}</div><div class="m">${m.year||""} · ${m.genre||""}</div></div>
  </div>`;
}
function wireCards(container){
  $$(".card", container).forEach(c=>{
    c.addEventListener("click", e=>{
      if(e.target.closest("[data-fav]")) return;
      openDetail(Number(c.dataset.id));
    });
  });
  $$("[data-fav]", container).forEach(b=>{
    b.addEventListener("click", async e=>{
      e.stopPropagation();
      await toggleWatchlist(Number(b.dataset.fav), b);
    });
  });
}

/* ---------- Hero ---------- */
function renderHero(){
  const list = allMovies.slice(0,5);
  const hero = $("#hero");
  if(!list.length){ hero.innerHTML=""; return; }
  clearInterval(heroTimer);
  heroIdx = 0;

  hero.innerHTML = `
    <div class="hero-track" id="hero-track">
      ${list.map(m=>`<div class="hero-slide-item"><img src="${m.poster_url||''}" alt=""></div>`).join("")}
    </div>
    <div class="hero-dots" id="hero-dots">
      ${list.map(()=>`<span></span>`).join("")}
      <span class="hero-dot-pill" id="hero-dot-pill"></span>
    </div>
    <div class="hero-body" id="hero-body"></div>`;

  const track = $("#hero-track");
  const pill = $("#hero-dot-pill");
  const body = $("#hero-body");
  const DOT_STEP = 11; // dot width (6px) + gap (5px)

  function paintBody(){
    const m = list[heroIdx];
    body.innerHTML = `
      <span class="hero-badge">★ ${m.rating||"—"} ${m.is_adult?" · +18":""}</span>
      <div class="hero-title">${m.title}</div>
      <div class="hero-meta">${m.year||""} · ${m.genre||""}</div>
      <div class="hero-actions">
        <button class="btn btn-gold" data-open="${m.id}">▶ بینین</button>
      </div>`;
    if(window.gsap){
      gsap.from(body.children, {opacity:0, y:12, duration:.4, ease:"power2.out", stagger:0.06});
    } else {
      body.classList.remove("fade-swap"); void body.offsetWidth; body.classList.add("fade-swap");
    }
    $("[data-open]", body).addEventListener("click", ()=>openDetail(m.id));
  }
  function goTo(i){
    heroIdx = i;
    track.style.transform = `translateX(-${i*100}%)`;
    pill.style.transform = `translateX(${i*DOT_STEP}px)`;
    paintBody();
  }
  goTo(0);
  hero.onclick = (e)=>{ if(!e.target.closest("[data-open]")) openDetail(list[heroIdx].id); };
  heroTimer = setInterval(()=>{ goTo((heroIdx+1)%list.length); }, 5000);
}

/* ---------- Home grids ---------- */
function renderHomeGrids(){
  const movies = allMovies.filter(m=>m.type==="movie").slice(0,4);
  const series = allMovies.filter(m=>m.type==="series").slice(0,4);
  const top250 = allMovies.filter(m=>m.is_top250);
  const topRated = (top250.length ? top250 : allMovies.slice().sort((a,b)=>(b.rating||0)-(a.rating||0))).slice(0,8);
  $("#grid-movies").innerHTML = movies.map(posterCard).join("") || `<div class="empty">هیچ نییە</div>`;
  $("#grid-series").innerHTML = series.map(posterCard).join("") || `<div class="empty">هیچ نییە</div>`;
  $("#grid-top").innerHTML = topRated.map(posterCard).join("") || `<div class="empty">هیچ نییە</div>`;
  wireCards($("#grid-movies")); wireCards($("#grid-series")); wireCards($("#grid-top"));
  animateCardsIn($("#grid-movies")); animateCardsIn($("#grid-series")); animateCardsIn($("#grid-top"));

  const cw = allMovies.filter(m => Object.keys(progressMap).some(k=>{
    if(!k.startsWith(m.id+":")) return false;
    const p = progressMap[k];
    return p.duration_seconds && p.progress_seconds < p.duration_seconds*0.95;
  }));
  if(session && cw.length){
    $("#cw-section").style.display="";
    $("#grid-cw").innerHTML = cw.map(posterCard).join("");
    wireCards($("#grid-cw"));
    animateCardsIn($("#grid-cw"));
  } else {
    $("#cw-section").style.display="none";
  }
}

/* ---------- Category / filtered list ---------- */
function openList(filterKey){
  currentListFilter = filterKey;
  $("#list-title").textContent = CAT_LABELS[filterKey] || "ئەنجامەکان";
  const items = allMovies.filter(m=>matchFilter(m, filterKey));

/* ---------- Watchlist actions ---------- */
async function toggleWatchlist(movieId, btnEl){
  if(!session){ toast("پێویستە بچیتە ژوورەوە"); setNav("account"); return; }
  const has = watchlistIds.has(movieId);
  if(has){
    watchlistIds.delete(movieId);
    await sb.from("watchlist").delete().eq("user_id", session.user.id).eq("movie_id", movieId);
  } else {
    watchlistIds.add(movieId);
    await sb.from("watchlist").upsert({ user_id: session.user.id, movie_id: movieId });
  }
  if(btnEl){
    btnEl.classList.toggle("on"); btnEl.textContent = watchlistIds.has(movieId) ? "♥" : "♡";
    if(window.gsap) gsap.fromTo(btnEl, {scale:1.4}, {scale:1, duration:.4, ease:"elastic.out(1,0.5)"});
  }
  syncDetailFav(movieId);
  if($("#view-watchlist").classList.contains("active")) renderWatchlistView();
}
function syncDetailFav(movieId){
  const d=$("#detail"); if(!d.classList.contains("open")) return;
  const favBtn = $(".fav-lg", d);
  if(favBtn && Number(favBtn.dataset.id)===movieId){
    favBtn.classList.toggle("on", watchlistIds.has(movieId));
    favBtn.textContent = watchlistIds.has(movieId) ? "♥" : "♡";
  }
}

function renderSimilar(m){

  wireCards(wrap);
  animateCardsIn(wrap);
}
async function renderEpisodesSection(m, prefetchedEps){
  const wrap = $("#episodes-wrap");
  let eps = prefetchedEps;
  if(!eps){
    wrap.innerHTML = `<div class="sec-title" style="margin-top:0">بەشەکان<span class="rule"></span></div><div class="spinner"></div>`;
    eps = await fetchEpisodesFor(m.id);
    if(activeVideoId !== m.id || !$("#episodes-wrap")) return;
  }
  if(!eps.length){
    wrap.innerHTML = `<div class="sec-title" style="margin-top:0">بەشەکان<span class="rule"></span></div><div class="empty" style="padding:24px 0"><div class="ic">🎬</div>هێشتا هیچ بەشێک زیاد نەکراوە</div>`;
    return;
  }
  const seasons = [...new Set(eps.map(e=>e.season||1))].sort((a,b)=>a-b);
  let curSeason = seasons[0];
  let curEp = null;

  function epsForSeason(){ return eps.filter(e=>(e.season||1)===curSeason).sort((a,b)=>a.episode_number-b.episode_number); }

  function renderGrid(){
    const list = epsForSeason();
    return `<div class="ep-num-grid">${list.map(e=>{
      const isReady = e.status==="released" && e.video_url;
      return `<button class="ep-num-btn ${isReady?'':'coming'} ${curEp&&curEp.id===e.id?'active':''}" data-ep="${e.id}" title="${e.title?escapeHtml(e.title):''}">${e.episode_number}</button>`;
    }).join("")}</div>`;
  }
  function renderNav(){
    const list = epsForSeason();
    const idx = curEp ? list.findIndex(e=>e.id===curEp.id) : -1;
    const prevEp = idx>0 ? list[idx-1] : null;
    const nextEp = idx>=0 && idx<list.length-1 ? list[idx+1] : null;
    return `<div class="ep-nav-row">
      <button id="ep-prev-btn" ${prevEp?'':'disabled'}>‹ ئەڵقەی پێشوو</button>
      <button id="ep-next-btn" ${nextEp?'':'disabled'}>ئەڵقەی دواتر ›</button>
    </div>`;
  }
  function playEpisode(e){
    curEp = e;
    if(e.status==="released" && e.video_url){
      mountPlayer(e.video_url, m.id, e.episode_number);
    } else {
      $("#player-wrap").style.display="";
      $("#player-wrap").innerHTML = comingBoxHtml(e, "sz-hero", "بەشی "+e.episode_number+(e.title?" · "+e.title:""));
      applyComingSpeeds($("#player-wrap"));
    }
    refresh();
  }
  function refresh(){
    $("#ep-grid-wrap").innerHTML = renderGrid();
    $("#ep-nav-wrap").innerHTML = renderNav();
    wireGrid(); wireNav();
  }
  function wireGrid(){
    $$(".ep-num-btn", wrap).forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const e = eps.find(x=>x.id===Number(btn.dataset.ep));
        if(e) playEpisode(e);
      });
    });
  }
  function wireNav(){
    const list = epsForSeason();
    const idx = curEp ? list.findIndex(e=>e.id===curEp.id) : -1;
    $("#ep-prev-btn")?.addEventListener("click", ()=>{ if(idx>0) playEpisode(list[idx-1]); });
    $("#ep-next-btn")?.addEventListener("click", ()=>{ if(idx>=0 && idx<list.length-1) playEpisode(list[idx+1]); });
  }

  const seasonSelectHtml = seasons.length>1
    ? `<select class="season-select" id="season-select">${seasons.map(s=>`<option value="${s}">وەرزی ${s}</option>`).join("")}</select>`
    : "";
  wrap.innerHTML = `<div class="sec-title" style="margin-top:0">بەشەکان<span class="rule"></span></div>${seasonSelectHtml}<div id="ep-nav-wrap">${renderNav()}</div><div id="ep-grid-wrap">${renderGrid()}</div>`;
  wireGrid(); wireNav();
  if(seasons.length>1){
    $("#season-select").addEventListener("change", e=>{
      curSeason = Number(e.target.value);
      curEp = null;
      refresh();
    });
  }
}

function openInfoModal(key){
  const page = INFO_PAGES[key];
  if(!page) return;
  $("#info-modal-title").textContent = page.title;
  $("#info-modal-body").innerHTML = page.body;
  $("#info-modal").classList.add("open");

}
function closeInfoModal(){
  $("#info-modal").classList.remove("open");

function closeDetail(){
  stopProgressTracking();
  $("#detail").classList.remove("open");
  document.body.style.overflow="";
  setTimeout(()=>{ $("#detail").innerHTML=""; }, 400);
}
function mountPlayer(videoUrl, movieId, episodeId){
  const epId = episodeId || 0;
  const wrap = $("#player-wrap");
  wrap.style.display="";
  const prior = progressMap[movieId+":"+epId];
  const startAt = (prior && prior.duration_seconds && prior.progress_seconds < prior.duration_seconds*0.95) ? prior.progress_seconds : 0;
  wrap.innerHTML = `<video id="active-video" controls playsinline src="${videoUrl||''}"></video>`;
  const v = $("#active-video");
  if(startAt>0) v.currentTime = startAt;
  wrap.scrollIntoView({behavior:"smooth", block:"center"});
  v.play().catch(()=>{});
  startProgressTracking(v, movieId, epId);
}
function startProgressTracking(video, movieId, episodeId){
  stopProgressTracking();
  progressTimer = setInterval(()=>saveProgress(video, movieId, episodeId), 12000);
  video.addEventListener("pause", ()=>saveProgress(video, movieId, episodeId));
  video.addEventListener("ended", ()=>saveProgress(video, movieId, episodeId, true));
}
function stopProgressTracking(){ clearInterval(progressTimer); progressTimer=null; }
async function saveProgress(video, movieId, episodeId, ended){
  if(!session || !video) return;
  const epId = episodeId || 0;
  const progress_seconds = ended ? Math.round(video.duration||0) : Math.round(video.currentTime||0);
  const duration_seconds = Math.round(video.duration||0) || null;
  progressMap[movieId+":"+epId] = { progress_seconds, duration_seconds };
  await sb.from("watch_progress").upsert({ user_id: session.user.id, movie_id: movieId, episode_id: epId, progress_seconds, duration_seconds, updated_at: new Date().toISOString() });
}

/* ---------- Ratings ---------- */
function renderRateRow(movieId){
  const row = $("#rate-row");
  if(!session){ row.innerHTML = `<span style="color:var(--muted);font-size:.85rem">بچۆ ژوورەوە بۆ هەڵسەنگاندن</span>`; return; }
  sb.from("user_ratings").select("rating").eq("user_id", session.user.id).eq("movie_id", movieId).maybeSingle()
    .then(({data})=>{
      const cur = data ? data.rating : 0;
      row.innerHTML = Array.from({length:10},(_,i)=>i+1).map(n=>
        `<span class="rate-star ${n<=cur?'on':''}" data-n="${n}">★</span>`).join("");
      $$(".rate-star", row).forEach(s=>s.addEventListener("click", async ()=>{
        const n = Number(s.dataset.n);
        await sb.from("user_ratings").upsert({ user_id: session.user.id, movie_id: movieId, rating: n });
        $$(".rate-star", row).forEach(x=>x.classList.toggle("on", Number(x.dataset.n)<=n));
        toast("هەڵسەنگاندنەکەت تۆمارکرا");
      }));
    });
}

/* ---------- Comments ---------- */
function renderCommentBox(movieId){
  const wrap = $("#comment-box-wrap");
  if(!session){ wrap.innerHTML = `<div style="color:var(--muted);font-size:.85rem;margin-bottom:14px">بچۆ ژوورەوە بۆ نووسینی بۆچوون</div>`; return; }
  wrap.innerHTML = `<div class="comment-box">
    <textarea id="comment-input" placeholder="بۆچوونت بنووسە..."></textarea>
    <button class="btn btn-gold btn-sm" id="comment-send">ناردن</button>
  </div>`;
  $("#comment-send").addEventListener("click", async ()=>{
    const body = $("#comment-input").value.trim();
    if(!body) return;
    $("#comment-send").textContent="...";
    const { error } = await sb.from("comments").insert({ user_id: session.user.id, movie_id: movieId, body });
    if(!error){ $("#comment-input").value=""; loadComments(movieId); }
    $("#comment-send").textContent="ناردن";
  });
}
async function loadComments(movieId){
  const list = $("#comments-list");
  const { data } = await sb.from("comments").select("id, body, created_at, user_id").eq("movie_id", movieId).order("created_at", {ascending:false});
  if(activeVideoId !== movieId) return;
  if(!data || !data.length){ list.innerHTML = `<div style="color:var(--muted-dim);font-size:.85rem;padding:10px 0">هێشتا هیچ بۆچوونێک نییە</div>`; return; }
  const ids = [...new Set(data.map(c=>c.user_id))];
  const { data: profs } = await sb.from("profiles").select("id, username").in("id", ids);
  const nameOf = id => (profs||[]).find(p=>p.id===id)?.username || "بەکارهێنەر";
  list.innerHTML = data.map(c=>`
    <div class="comment">
      <div class="who">${nameOf(c.user_id)}</div>
      <div class="txt">${c.body.replace(/</g,"&lt;")}</div>
      <div class="when">${new Date(c.created_at).toLocaleDateString('ku')}</div>
    </div>`).join("");
}

function enhanceSpinner(el){
  if(!window.lottie || el.dataset.lottieDone) return;
  el.dataset.lottieDone = "1";
  el.style.border = "none";
  el.style.animation = "none";
  playLottie(el, GOLD_SPINNER_LOTTIE, {loop:true});
}
function scanSpinners(root){
  (root||document).querySelectorAll(".spinner:not([data-lottie-done])").forEach(enhanceSpinner);
}
const spinnerObserver = new MutationObserver(muts=>{
  muts.forEach(m=> m.addedNodes.forEach(n=>{
    if(n.nodeType!==1) return;
    if(n.classList?.contains("spinner")) enhanceSpinner(n);
    n.querySelectorAll?.(".spinner:not([data-lottie-done])").forEach(enhanceSpinner);
  }));
});
spinnerObserver.observe(document.body, {childList:true, subtree:true});
scanSpinners();

/* ---------- Lottie (ready to use — pass any exported .json from LottieFiles.com) ---------- */
function playLottie(containerEl, animationDataOrPath, opts){
  if(!window.lottie || !containerEl) return null;
  containerEl.innerHTML = "";
  const isUrl = typeof animationDataOrPath === "string";
  return lottie.loadAnimation({
    container: containerEl,
    renderer: "svg",
    loop: opts?.loop !== false,
    autoplay: true,
    path: isUrl ? animationDataOrPath : undefined,
    animationData: isUrl ? undefined : animationDataOrPath
  });
}
function animateCardsIn(container){
  const cards = $$(".card", container);
  if(!cards.length) return;
  if(window.gsap){
    gsap.killTweensOf(cards);
    gsap.from(cards, {opacity:0, y:16, duration:.45, ease:"power3.out", stagger:0.045});
  }
}
function showView(name){
  const current = $(".view.active");
  const next = $("#view-"+name);
  if(!next) return;
  if(current === next) return;
  if(current && window.gsap){
    gsap.to(current, {opacity:0, y:6, duration:.16, ease:"power1.in", onComplete:()=>{
      current.classList.remove("active");
      gsap.set(current, {clearProps:"opacity,transform"});
      revealView(next);
    }});
  } else {
    $$(".view").forEach(v=>v.classList.remove("active"));
    revealView(next);
  }
}
function revealView(next){
  next.classList.add("active");
  if(window.gsap){
    gsap.fromTo(next, {opacity:0, y:10}, {opacity:1, y:0, duration:.32, ease:"power2.out"});
    animateCardsIn(next);
  }
}
function setNav(name){
  $$(".nav-btn").forEach(b=>b.classList.toggle("active", b.dataset.nav===name));
  if(name==="watchlist") renderWatchlistView();
  if(name==="account") renderAccountView();
  showView(name);
}
$$(".nav-btn").forEach(b=> b.addEventListener("click", ()=> setNav(b.dataset.nav)));

/* ---------- Data loading ---------- */
async function loadMovies(){
  const { data, error } = await sb.from("movies").select("*").order("created_at", {ascending:false});
  if(!error) allMovies = data || [];
  renderHero(); renderHomeGrids();
}
async function loadWatchlist(){
  if(!session){ watchlistIds = new Set(); progressMap = {}; renderHomeGrids(); return; }
  const [{data:wl}, {data:wp}] = await Promise.all([
    sb.from("watchlist").select("movie_id").eq("user_id", session.user.id),
    sb.from("watch_progress").select("movie_id, episode_id, progress_seconds, duration_seconds").eq("user_id", session.user.id)
  ]);
  watchlistIds = new Set((wl||[]).map(r=>r.movie_id));
  progressMap = {}; (wp||[]).forEach(r=> progressMap[r.movie_id+":"+(r.episode_id||0)] = { progress_seconds:r.progress_seconds, duration_seconds:r.duration_seconds });
  renderHomeGrids();
}
async function loadProfile(){
  if(!session){ profile=null; return; }
  const { data } = await sb.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
  profile = data;
}

/* ---------- Auth state ---------- */
sb.auth.onAuthStateChange(async (event, sess)=>{
  session = sess;
  await loadProfile();
  await loadWatchlist();
  if($("#view-account").innerHTML!=="" || event==="SIGNED_IN" || event==="SIGNED_OUT") renderAccountView();
  if($("#view-account").classList.contains("active")) renderAccountView();
  if(event==="SIGNED_IN") toast("بەخێربێیتەوە!");
});

/* ---------- Boot ---------- */
(async function boot(){
  const { data:{ session: s } } = await sb.auth.getSession();
  session = s;
  await loadProfile();
  await loadMovies();
  await loadWatchlist();
  renderAccountView();
})();
